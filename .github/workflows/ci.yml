name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  norms:
    name: 规范闸机与测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 代码格式检查
        run: npm run format:check
      - name: 架构与规范闸机（真实仓库）
        run: npm run gate
      - name: 闸机可用性 probe 与包测试
        run: npm test
      - name: 构建
        run: npm run build
      - name: 类型检查
        run: npm run typecheck
